[package]
name = "gpui_frontend"
version.workspace = true
edition = "2024"
build = "src/build.rs"
default-run = "emu6502"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pico-args = "0.5.0"
rfd = { version = "0.17.2", default-features = false, features = ['xdg-portal'] }
emu6502 = { path = "../emulator" }
#sdl2 = "0.35.2"
#sdl2 = { version = "0.35.2", features = ['bundled', 'static-link'] }
#serde_yaml = { version = "0.9.34", optional = true }
serde-saphyr = { version = "1.3.0", optional = true }
image = { version = "0.25.10", default-features = false, features = ['png'] }
spin_sleep = "1.3.3"
#tokio = { version = "1.49.0", features = ['rt-multi-thread', 'macros'] }
strum = "0.28.0"
chrono = "0.4.45"
futures = "0.3.34"
cpal = "0.18.2"
gilrs = "0.11.2"

# GPUI (Zed's GPU-accelerated UI framework) replaces the Dear ImGui frontend.
# On Linux, only the Wayland backend is enabled (avoids the libxkbcommon-x11
# link requirement; X11 hosts can add the "x11" feature back if needed).
[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["wayland", "font-kit"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
gpui = "0.2.2"

#serde_yaml2 = { version = "0.1.3", optional = true }
#serde_yml = { version = "0.0.11", optional = true }
#regex = { version = "1.10.6", optional = true }

[target.'cfg(any(target_os="windows"))'.dependencies]
# CTRL_CLOSE/CTRL_LOGOFF/CTRL_SHUTDOWN handling (Windows equivalent of SIGTERM)
windows-sys = { version="0.61.2", features = ['Win32_System_LibraryLoader', 'Win32_System_Console'] }
# SIGTERM/SIGINT/SIGHUP handling on Linux and macOS
[target.'cfg(unix)'.dependencies]
libc = "0.2"

#[target.x86_64-pc-windows-msvc.dependencies]
#winapi = "0.3.9"

[build-dependencies]
embed-resource = "3.0.11"

[features]
#default = [ ]
default = ["serialization", "serde_support", "z80", "flate","zip"]

serialization = []
#default = ["serde_support", "z80", "flate", "regex"]
#serde_support = ["dep:serde_yaml", "emu6502/serde_support"]
serde_support = ["dep:serde-saphyr", "emu6502/serde_support"]
#serde_support = ["dep:serde_yml", "emu6502/serde_support"]
#regex = ["dep:regex"]
z80 = ["emu6502/z80"]
flate = ["emu6502/flate"]
zip = ["emu6502/zip"]
pcap = ["emu6502/pcap"]

[[bin]]
name = "emu6502"
path = "src/main.rs"
