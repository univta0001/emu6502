[package]
name = "sdl_frontend"
version.workspace = true
edition = "2024"
build = "src/build.rs"
default-run = "emu6502"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pico-args = "0.5.0"
rfd = { version = "0.17.2", default-features = false, features = ['xdg-portal'] }
emu6502 = { path = "../emulator" }
#sdl2 = "0.35.2"
#sdl2 = { version = "0.35.2", features = ['bundled', 'static-link'] }
#serde_yaml = { version = "0.9.34", optional = true }
serde-saphyr = { version = "2.0.0", optional = true }
image = { version = "0.25.10", default-features = false, features = ['png'] }
spin_sleep = "1.3.3"
#tokio = { version = "1.49.0", features = ['rt-multi-thread', 'macros'] }
imgui = { version = "0.12.0" }
imgui-sdl3 = "0.5.2"
strum = "0.28.0"
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

#serde_yaml2 = { version = "0.1.3", optional = true }
#serde_yml = { version = "0.0.11", optional = true }
#regex = { version = "1.10.6", optional = true }

[target.'cfg(any(target_os="windows"))'.dependencies]
windows-sys = { version="0.61.2", features = ['Win32_System_LibraryLoader'] }

[target.'cfg(any(target_os="windows", target_os="linux"))'.dependencies]
#sdl2 = { version = "0.38.0", features = ['bundled', 'static-link'] }
sdl3 = { version = "0.20.0", features = ['build-from-source-static', 'main', 'raw-window-handle', 'static-link'] }
sdl3-main = "0.7.0"
#sdl3-sys = { version = "0.6.8", features = ['build-from-source-static'] }

[target.'cfg(not(any(target_os="windows", target_os="linux")))'.dependencies]
#sdl2 = "0.38.0"
sdl3 = { version = "0.20.0", features = ['main', 'raw-window-handle'] }
sdl3-main = "0.7.0"
#sdl3-sys = "0.6.8"

#[target.x86_64-pc-windows-msvc.dependencies]
#winapi = "0.3.9"

[build-dependencies]
embed-resource = "3.0.12"

[features]
#default = [ ]
default = ["serialization", "serde_support", "z80", "flate", "zip"]

serialization = []
#default = ["serde_support", "z80", "flate", "regex"]
#serde_support = ["dep:serde_yaml", "emu6502/serde_support"]
serde_support = ["dep:serde-saphyr", "emu6502/serde_support"]
#serde_support = ["dep:serde_yml", "emu6502/serde_support"]
#regex = ["dep:regex"]
z80 = ["emu6502/z80"]
flate = ["emu6502/flate"]
zip = ["emu6502/zip"]
pcap = ["emu6502/pcap"]
# Model Context Protocol server over stdio (--mcp)
mcp = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "emu6502"
path = "src/main.rs"
